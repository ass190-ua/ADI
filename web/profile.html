<!doctype html>
<html lang="es" data-theme="dark" data-component="ProfilePage">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perfil · Memories+</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body data-part="body">
  <div class="page" data-component="MainLayout">

    <!-- Header (privado, como Home/Photos) -->
    <header class="app-header" data-component="AppHeader" data-variant="private">
      <div class="brand" data-part="brand">
        <a class="logo" href="home.html" data-part="logo-link">
          <img src="assets/img/logo_header.png" alt="Memories+" data-part="logo-img">
          <span class="visually-hidden">Memories+</span>
        </a>
      </div>

      <!-- Toggle móvil -->
      <input type="checkbox" id="menu-toggle" class="menu-toggle" aria-label="Abrir menú" data-part="menu-toggle">
      <label for="menu-toggle" class="menu-btn" aria-hidden="true" data-part="menu-btn">☰</label>

      <nav class="app-nav" aria-label="Secciones" data-part="nav"></nav>

      <!-- Menú de usuario -->
      <div class="user-actions" data-part="user-actions">
        <details class="user-menu" data-component="UserMenu">
          <summary aria-label="Abrir menú de usuario" data-part="summary">
            <img class="avatar" src="assets/img/perfil.jpg" alt="Tu avatar" data-part="avatar">
          </summary>
          <nav class="menu" aria-label="Menú de usuario" data-part="menu">
            <a href="profile.html" aria-current="page" data-part="menu-item">👤 Perfil</a>
            <a href="login.html" data-part="menu-item">⏻ Cerrar sesión</a>
          </nav>
        </details>
      </div>
    </header>

    <!-- App shell -->
    <main class="app-shell" data-component="AppShell">
      <!-- Sidebar principal -->
      <aside class="sidebar" data-component="Sidebar">
        <nav class="sidebar-nav" aria-label="Principal" data-component="SiteNav">
          <a href="home.html" data-part="nav-link">🏠 Inicio</a>
          <a href="photos.html" data-part="nav-link">🖼️ Fotos</a>
          <a href="chats.html" data-part="nav-link">💬 Chats</a>
          <a href="events.html" data-part="nav-link">🎉 Eventos</a>
          <a href="profile.html" aria-current="page" data-part="nav-link">👤 Perfil</a>
        </nav>
      </aside>

      <!-- Contenido -->
      <section class="app-main container" aria-labelledby="profile-title" data-component="ProfileContent">
        <!-- Portada del perfil -->
        <div class="profile-hero card" role="img" aria-label="Portada del perfil" data-component="ProfileCover"></div>

        <!-- Cabecera de usuario -->
        <div class="card pad profile-header-card" data-component="ProfileHeader">
          <div class="row" style="gap:16px; align-items:center; flex-wrap:wrap;" data-part="row">
            <!-- Avatar editable (input file sin JS) -->
            <div class="avatar avatar-lg avatar-edit" data-part="avatar-wrap">
              <img src="assets/img/perfil.jpg" alt="Avatar de usuario" data-part="avatar-img">
              <input id="avatar-file" type="file" accept="image/*" aria-label="Cambiar avatar" data-part="avatar-input">
              <label for="avatar-file" class="avatar-badge" title="Cambiar avatar" aria-label="Cambiar avatar" data-part="avatar-badge"></label>
            </div>
            <div style="flex:1; min-width:220px;" data-part="intro">
              <h1 id="profile-title" class="h2" style="margin:0;" data-part="title">Tu perfil</h1>
              <div class="p" style="opacity:.9;" data-part="subtitle">Gestiona tus datos y preferencias</div>
            </div>
          </div>
        </div>

        <!-- Grid de ajustes -->
        <div class="grid grid-2" style="margin-top:16px;" data-component="SettingsGrid">
          <!-- Datos básicos -->
          <form class="card pad form" autocomplete="on" data-component="ProfileForm" aria-labelledby="basic-title">
            <div class="title" id="basic-title" data-part="title">Datos básicos</div>

            <div class="input" data-part="field">
              <label data-part="label">Nombre</label>
              <input type="text" name="name" placeholder="Tu nombre" value="Arturo Soriano" data-part="input">
            </div>

            <div class="input" data-part="field">
              <label data-part="label">Usuario</label>
              <input type="text" name="username" placeholder="@usuario" value="@arturosoriano" data-part="input">
            </div>

            <div class="input" data-part="field">
              <label data-part="label">Email</label>
              <input type="email" name="email" placeholder="tucorreo@ejemplo.com" value="arturo@ejemplo.com" data-part="input">
            </div>

            <div class="actions" style="justify-content:flex-end;" data-part="actions">
              <button class="btn" style="color: white;" data-part="save">Guardar cambios</button>
            </div>
          </form>

          <!-- Preferencias -->
          <form class="card pad form" data-component="PreferencesForm" aria-labelledby="prefs-title">
            <div class="title" id="prefs-title" data-part="title">Preferencias</div>

            <div class="input" data-part="field">
              <label data-part="label">Idioma</label>
              <select name="lang" data-part="select">
                <option selected>Español</option>
                <option>English</option>
              </select>
            </div>

            <div class="input" data-part="field">
              <label data-part="label">Tema</label>
              <select name="theme" data-part="select">
                <option selected>Oscuro</option>
                <option>Claro</option>
              </select>
            </div>

            <div class="input" data-part="field">
              <label data-part="label">Privacidad</label>
              <select name="privacy" data-part="select">
                <option selected>Solo amigos</option>
                <option>Público</option>
                <option>Privado</option>
              </select>
            </div>

            <div class="actions" style="justify-content:flex-end;" data-part="actions">
              <button class="btn" style="color: white;" data-part="save">Actualizar preferencias</button>
            </div>
          </form>

          <!-- Seguridad: cambio de contraseña -->
          <form class="card pad form" data-component="SecurityForm" aria-labelledby="sec-title">
            <div class="title" id="sec-title" data-part="title">Seguridad</div>

            <div class="input" data-part="field">
              <label data-part="label">Contraseña actual</label>
              <input type="password" name="current_password" placeholder="••••••••" data-part="input">
            </div>

            <div class="input" data-part="field">
              <label data-part="label">Nueva contraseña</label>
              <input type="password" name="new_password" placeholder="Mín. 8 caracteres" data-part="input">
            </div>

            <div class="input" data-part="field">
              <label data-part="label">Confirmar nueva</label>
              <input type="password" name="confirm_password" placeholder="Repite la nueva contraseña" data-part="input">
            </div>

            <div class="actions" style="justify-content:flex-end;" data-part="actions">
              <button class="btn" style="color: white;" data-part="save">Cambiar contraseña</button>
            </div>
          </form>

          <!-- Zona de peligro -->
          <div class="card pad" data-component="DangerZone">
            <div class="title" data-part="title">Zona de peligro</div>
            <p class="p" data-part="desc">Estas acciones no se pueden deshacer. Procede con precaución.</p>
            <div class="row" style="gap:8px; flex-wrap:wrap;" data-part="actions">
              <button class="btn ghost" style="color: white;" data-part="deactivate">Desactivar cuenta</button>
              <button class="btn" style="background:#ef4444; border-color:#ef4444;" data-part="delete">Eliminar cuenta</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer book-footer" data-component="AppFooter">
      <div class="container" data-part="container">
        <nav class="navline" aria-label="Enlaces del pie" data-part="nav">
          <a href="contact.html" class="footer-link" data-part="link">Contacto</a>
          <span class="sep" data-part="sep">•</span>
          <div class="social" aria-label="Redes sociales" data-part="social">
            <a href="#" aria-label="Facebook" class="icon" data-part="social-link">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M22 12.06C22 6.48 17.52 2 11.94 2S2 6.48 2 12.06c0 5.01 3.66 9.17 8.44 9.94v-7.03H7.9v-2.9h2.54V9.41c0-2.5 1.49-3.88 3.77-3.88 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.87h2.78l-.44 2.9h-2.34V22c4.78-.77 8.44-4.93 8.44-9.94Z"/></svg>
            </a>
            <a href="#" aria-label="X/Twitter" class="icon" data-part="social-link">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M3 3h4.6l4.1 6.1L16.8 3H21l-7.3 9.4L21 21h-4.6l-4.5-6.7L7.2 21H3l7.7-9.9L3 3Z"/></svg>
            </a>
            <a href="#" aria-label="Instagram" class="icon" data-part="social-link">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 0 5-5Zm10 2H7a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3Zm-5 3.8a5.2 5.2 0 1 1 0 10.4A5.2 5.2 0 0 1 12 7.8Zm0 2a3.2 3.2 0 1 0 0 6.4 3.2 3.2 0 0 0 0-6.4Zm4.8-.6a.9.9 0 1 1 0 1.8.9.9 0 0 1 0-1.8Z"/></svg>
            </a>
          </div>
          <span class="sep" data-part="sep">•</span>
          <a href="legalpolitics.html" class="footer-link" data-part="link">Políticas legales</a>
        </nav>
        <div class="copy" data-part="copy">
          <small>© 2025 — <strong>Memories+</strong></small>
        </div>
      </div>
    </footer>
  </div>
</body>
</html>
