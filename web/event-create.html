<!doctype html>
<html lang="es" data-theme="dark" data-component="EventCreatePage">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear evento · Memories+</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body data-part="body">
  <div class="page" data-component="MainLayout">

    <!-- Header privado -->
    <header class="app-header" data-component="AppHeader" data-variant="private">
      <div class="brand" data-part="brand">
        <a class="logo" href="home.html" data-part="logo-link">
          <img src="assets/img/logo_header.png" alt="Memories+" data-part="logo-img">
          <span class="visually-hidden">Memories+</span>
        </a>
      </div>
      <input type="checkbox" id="menu-toggle" class="menu-toggle" aria-label="Abrir menú" data-part="menu-toggle">
      <label for="menu-toggle" class="menu-btn" data-part="menu-btn">☰</label>
      <nav class="app-nav" data-part="nav" aria-label="Secciones"></nav>
      <div class="user-actions" data-part="user-actions">
        <details class="user-menu" data-component="UserMenu">
          <summary aria-label="Abrir menú de usuario" data-part="summary">
            <img class="avatar" src="" alt="Tu avatar" data-part="avatar" style="display:none;">
          </summary>
          <nav class="menu" aria-label="Menú de usuario" data-part="menu">
            <a href="profile.html" data-part="menu-item">👤 Perfil</a>
            <a href="login.html" data-part="menu-item">⏻ Cerrar sesión</a>
          </nav>
        </details>
      </div>
    </header>

    <!-- Shell -->
    <main class="app-shell" data-component="AppShell">
      <!-- Sidebar principal -->
      <aside class="sidebar" data-component="Sidebar">
        <nav class="sidebar-nav" aria-label="Principal" data-component="SiteNav">
          <a href="home.html" data-part="nav-link">🏠 Inicio</a>
          <a href="photos.html" data-part="nav-link">🖼️ Fotos</a>
          <a href="chats.html" data-part="nav-link">💬 Chats</a>
          <a href="events.html" aria-current="page" data-part="nav-link">🎉 Eventos</a>
        </nav>
      </aside>

      <!-- Contenido principal: formulario creación de evento -->
      <section class="app-main container" data-component="EventCreateContent">
        <h1 class="h2" style="margin:0 0 10px;" data-part="title">Crear evento</h1>

        <!-- Formulario real (JS) -->
        <form class="card pad form" autocomplete="on" novalidate data-component="EventForm" enctype="multipart/form-data">
          <!-- Portada -->
          <figure class="cover-uploader card" data-component="CoverUploader">
            <img alt="Portada del evento (opcional)" data-part="preview" />
            <input id="cover-file" name="cover" type="file" accept="image/*" aria-label="Subir portada" data-part="input">
            <label for="cover-file" class="cover-badge" title="Subir portada" aria-label="Subir portada" data-part="button">📷 Subir portada</label>
          </figure>

          <div class="grid grid-2" style="margin-top:12px;" data-part="grid">
            <div class="input" data-part="field">
              <label for="e-title" data-part="label">Título del evento</label>
              <input id="e-title" name="title" type="text" placeholder="Ej. Cumple de Alba" required data-part="input">
            </div>

            <!-- (Opcional) Privacidad — NO se envía a PB si tu schema no lo tiene -->
            <div class="input" data-part="field">
              <label for="e-privacy" data-part="label">Privacidad</label>
              <select id="e-privacy" name="privacy" data-part="select">
                <option value="friends" selected>Solo amigos</option>
                <option value="public">Público</option>
                <option value="private">Privado</option>
              </select>
            </div>

            <div class="input" data-part="field">
              <label for="e-date" data-part="label">Fecha y hora</label>
              <!-- name="date" para que cuadre con tu colección -->
              <input id="e-date" name="date" type="datetime-local" required data-part="input">
            </div>

            <!-- (Opcional) RSVP límite — NO se envía a PB si tu schema no lo tiene -->
            <div class="input" data-part="field">
              <label for="e-rsvp" data-part="label">Fecha límite RSVP (opcional)</label>
              <input id="e-rsvp" name="rsvp_deadline" type="date" data-part="input">
            </div>

            <div class="input" data-part="field">
              <label for="e-location" data-part="label">Ubicación (o enlace si es online)</label>
              <input id="e-location" name="location" type="text" placeholder="Parque Central / https://meet..." data-part="input">
            </div>

            <!-- (Opcional) Aforo — NO se envía a PB si tu schema no lo tiene -->
            <div class="input" data-part="field">
              <label for="e-capacity" data-part="label">Aforo (opcional)</label>
              <input id="e-capacity" name="capacity" type="number" min="1" placeholder="Ej. 20" data-part="input">
            </div>
          </div>

          <div class="input" data-part="field">
            <label for="e-desc" data-part="label">Descripción</label>
            <textarea id="e-desc" name="description" rows="6" placeholder="Cuéntales a los invitados qué habrá, dress code, qué traer…" data-part="textarea"></textarea>
          </div>

          <!-- Etiquetas rápidas (decorativo) -->
          <div class="input" data-part="field">
            <label data-part="label">Etiquetas</label>
            <div class="row" style="gap:8px; flex-wrap:wrap;" data-part="chips">
              <button class="chip todos" type="button" data-tag="Fiesta">🎉 Fiesta</button>
              <button class="chip favoritos" type="button" data-tag="Cumpleaños">🍰 Cumpleaños</button>
              <button class="chip videos" type="button" data-tag="Exterior">🌤️ Exterior</button>
              <button class="chip albumnes" type="button" data-tag="Familia">👨‍👩‍👧 Familia</button>
            </div>
            <small class="p" style="opacity:.75;" data-part="hint">(Decorativo por ahora; si quieres, lo convertimos a campo real de tipo array)</small>
          </div>

          <!-- Invitados (decorativo) -->
          <div class="input" data-part="field">
            <label for="e-guests" data-part="label">Invitar (emails separados por comas)</label>
            <input id="e-guests" name="guests" type="text" placeholder="alba@ejemplo.com, juan@ejemplo.com" data-part="input">
          </div>

          <!-- Acciones -->
          <div class="actions" style="justify-content:flex-end; gap:8px; margin-top:8px;" data-part="actions">
            <a class="btn ghost" href="events.html" data-part="cancel">Cancelar</a>
            <button class="btn" type="reset" style="color: white;" data-part="reset">Limpiar</button>
            <button class="btn" type="submit" style="color: white;" data-part="submit">✅ Crear evento</button>
          </div>
        </form>

        <p id="create-msg" class="p" style="margin-top:8px;"></p>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer book-footer" data-component="AppFooter">
      <div class="container" data-part="container">
        <nav class="navline" aria-label="Enlaces del pie" data-part="nav">
          <a href="contact.html" class="footer-link" data-part="link">Contacto</a>
          <span class="sep" data-part="sep">•</span>
          <div class="social" aria-label="Redes sociales">
            <a href="#" aria-label="Facebook" class="icon">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M22 12.06C22 6.48 17.52 2 11.94 2S2 6.48 2 12.06c0 5.01 3.66 9.17 8.44 9.94v-7.03H7.9v-2.9h2.54V9.41c0-2.5 1.49-3.88 3.77-3.88 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.87h2.78l-.44 2.9h-2.34V22c4.78-.77 8.44-4.93 8.44-9.94Z"/></svg>
            </a>
            <a href="#" aria-label="X/Twitter" class="icon">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M3 3h4.6l4.1 6.1L16.8 3H21l-7.3 9.4L21 21h-4.6l-4.5-6.7L7.2 21H3l7.7-9.9L3 3Z"/></svg>
            </a>
            <a href="#" aria-label="Instagram" class="icon">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 0 5-5Zm10 2H7a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3Zm-5 3.8a5.2 5.2 0 1 1 0 10.4A5.2 5.2 0 0 1 12 7.8Zm0 2a3.2 3.2 0 1 0 0 6.4 3.2 3.2 0 0 0 0-6.4Zm4.8-.6a.9.9 0 1 1 0 1.8.9.9 0 0 1 0-1.8Z"/></svg>
            </a>
          </div>
          <span class="sep" data-part="sep">•</span>
          <a href="legalpolitics.html" class="footer-link" data-part="link">Políticas legales</a>
        </nav>
        <div class="copy" data-part="copy">
          <small>© 2025 — <strong>Memories+</strong></small>
        </div>
      </div>
    </footer>
  </div>

  <script type="module">
    import { requireAuth, logoutAndGo, currentUser } from "./assets/js/services/auth_service.js";
    import { pb } from "./assets/js/pb.js";
    import { createEvent } from "./assets/js/services/events_services.js";

    // Protección + logout
    requireAuth("login.html");
    const logoutLink = [...document.querySelectorAll('[data-part="menu-item"]')]
      .find(a => a.textContent.includes("Cerrar sesión"));
    if (logoutLink) logoutLink.addEventListener("click", (e) => { e.preventDefault(); logoutAndGo("login.html"); });

    // ---- Header: avatar real o iniciales ----
    function mountAvatarOrInitials({ container, imgEl, nameOrUser, fileUrl }) {
      if (!container) return;
      container.querySelector('.avatar-initials')?.remove();
      if (fileUrl) {
        if (imgEl) {
          imgEl.src = fileUrl;
          imgEl.alt = nameOrUser || "avatar";
          imgEl.style.display = "block";
        }
      } else {
        if (imgEl) imgEl.style.display = "none";
        const initials = (nameOrUser||"?").toString().trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
        const div = document.createElement('div');
        div.className = 'avatar-initials';
        div.textContent = initials;
        container.appendChild(div);
      }
    }
    const me = currentUser();
    const headerWrap = document.querySelector('[data-component="UserMenu"] [data-part="summary"]');
    const headerImg  = document.querySelector('[data-component="UserMenu"] [data-part="avatar"]');
    const meUrl = me?.avatar ? pb.files.getUrl(me, me.avatar, { token: pb.authStore.token, thumb: "100x100" }) : null;
    mountAvatarOrInitials({
      container: headerWrap,
      imgEl: headerImg,
      nameOrUser: me?.name || me?.username,
      fileUrl: meUrl
    });

    // ---- Formulario crear evento ----
    const form          = document.querySelector('form[data-component="EventForm"]');
    const msg           = document.getElementById('create-msg');
    const submitBtn     = form.querySelector('[data-part="submit"]');
    const coverInput    = document.getElementById('cover-file');
    const coverPreview  = document.querySelector('[data-component="CoverUploader"] [data-part="preview"]');

    const FALLBACK_SVG = `data:image/svg+xml;utf8,` + encodeURIComponent(`
      <svg xmlns='http://www.w3.org/2000/svg' width='600' height='400'>
        <rect width='100%' height='100%' fill='#222'/>
        <text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle'
              fill='#999' font-family='system-ui,Arial' font-size='24'>Portada (opcional)</text>
      </svg>`);
    coverPreview.src = FALLBACK_SVG;

    // Preview portada
    coverInput.addEventListener('change', () => {
      const f = coverInput.files?.[0];
      if (!f) { coverPreview.src = FALLBACK_SVG; return; }
      const MAX_MB = 10;
      if (f.size > MAX_MB * 1024 * 1024) {
        coverInput.value = '';
        coverPreview.src = FALLBACK_SVG;
        alert(`La portada supera ${MAX_MB}MB`);
        return;
      }
      const url = URL.createObjectURL(f);
      coverPreview.src = url;
      coverPreview.onload = () => URL.revokeObjectURL(url);
    });

    // datetime-local -> ISO
    function toISOorNull(localValue) {
      if (!localValue) return null;
      const d = new Date(localValue);
      return isNaN(d.getTime()) ? null : d.toISOString();
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "";
      submitBtn.disabled = true;
      submitBtn.textContent = "Creando…";

      // Solo campos de tu colección
      const title       = document.getElementById('e-title').value.trim();
      const dateLocal   = document.getElementById('e-date').value;
      const location    = document.getElementById('e-location').value.trim();
      const description = document.getElementById('e-desc').value.trim();
      const coverFile   = coverInput.files?.[0];

      if (!title)   { msg.textContent = "El título es obligatorio.";   submitBtn.disabled = false; submitBtn.textContent = "✅ Crear evento"; return; }
      if (!dateLocal){msg.textContent = "La fecha/hora es obligatoria.";submitBtn.disabled = false; submitBtn.textContent = "✅ Crear evento"; return; }

      const dateISO = toISOorNull(dateLocal);
      if (!dateISO) { msg.textContent = "Fecha/hora inválida."; submitBtn.disabled = false; submitBtn.textContent = "✅ Crear evento"; return; }

      const fd = new FormData();
      fd.append('title', title);
      fd.append('date', dateISO);
      if (location)    fd.append('location', location);
      if (description) fd.append('description', description);
      if (coverFile)   fd.append('cover', coverFile, coverFile.name);

      try {
        const rec = await createEvent(fd);
        msg.textContent = "Evento creado correctamente ✅";
        setTimeout(() => (window.location.href = `event.html?id=${rec.id}`), 600);
      } catch (err) {
        console.error(err);
        msg.textContent = "Error al crear el evento ❌";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "✅ Crear evento";
      }
    });
  </script>
</body>
</html>
