<!doctype html>
<html lang="es" data-theme="dark" data-component="PhotosPage">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fotos · Memories+</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body data-part="body">
  <div class="page" data-component="MainLayout">

    <!-- Header -->
    <header class="app-header" data-component="AppHeader" data-variant="private">
      <div class="brand" data-part="brand">
        <a class="logo" href="home.html" data-part="logo-link">
          <img src="assets/img/logo_header.png" alt="Memories+" data-part="logo-img">
          <span class="visually-hidden">Memories+</span>
        </a>
      </div>

      <input type="checkbox" id="menu-toggle" class="menu-toggle" aria-label="Abrir menú" data-part="menu-toggle">
      <label for="menu-toggle" class="menu-btn" aria-hidden="true" data-part="menu-btn">☰</label>
      <nav class="app-nav" aria-label="Secciones" data-part="nav"></nav>

      <div class="user-actions" data-part="user-actions">
        <details class="user-menu" data-component="UserMenu">
          <summary aria-label="Abrir menú de usuario" data-part="summary">
            <img class="avatar" src="" alt="Tu avatar" data-part="avatar" style="display:none;">
          </summary>
          <nav class="menu" aria-label="Menú de usuario" data-part="menu">
            <a href="profile.html" data-part="menu-item">👤 Perfil</a>
            <a href="login.html" data-part="menu-item">⏻ Cerrar sesión</a>
          </nav>
        </details>
      </div>
    </header>

    <!-- Shell -->
    <main class="app-shell" data-component="AppShell">
      <aside class="sidebar" data-component="Sidebar">
        <nav class="sidebar-nav" aria-label="Principal" data-component="SiteNav">
          <a href="home.html" data-part="nav-link">🏠 Inicio</a>
          <a href="photos.html" aria-current="page" data-part="nav-link">🖼️ Fotos</a>
          <a href="chats.html" data-part="nav-link">💬 Chats</a>
          <a href="events.html" data-part="nav-link">🎉 Eventos</a>
        </nav>
      </aside>

      <section class="app-main container" data-component="PhotosContent">
        <!-- Título + chips -->
        <div class="row" style="justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
          <h1 class="h2" style="margin:0;">Tu galería</h1>
          <div class="row" style="gap:8px; flex-wrap:wrap;">
            <button class="chip todos active" type="button">Todos</button>
            <button class="chip favoritos" type="button">Favoritos</button> 
            <button class="chip videos" type="button" disabled>Vídeos</button>
            <button class="chip albumnes" type="button" disabled>Álbumes</button>
          </div>
        </div>

        <!-- Toolbar -->
        <div class="row" style="gap:10px; margin-top:10px; flex-wrap:wrap;">
          <div class="input" style="flex:1; min-width:220px;">
            <label class="visually-hidden" for="q">Buscar en galería</label>
            <input id="q" type="search" placeholder="Buscar por título, lugar o etiqueta… 🔍">
          </div>
          <button class="btn" style="color: white;" data-part="upload">⬆️ Subir</button>
          <button class="btn ghost" style="color: white;" data-part="sort">↕ Ordenar (recientes)</button>
          <button class="btn ghost" style="color: white;" data-part="select">✅ Seleccionar</button>
          <button class="btn ghost" style="color: white;" data-part="delete" disabled>🗑️ Eliminar</button>

          <!-- input de subida (oculto) -->
          <input id="photo-file" type="file" accept="image/*" multiple style="display:none;">
        </div>

        <!-- Galería dinámica -->
        <section class="gallery" style="margin-top:16px;" data-component="PhotoGrid" aria-live="polite"></section>
        <p id="photos-msg" class="p" style="margin-top:8px;"></p>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer book-footer" data-component="AppFooter">
      <div class="container" data-part="container">
        <nav class="navline" aria-label="Enlaces del pie" data-part="nav">
          <a href="contact.html" class="footer-link" data-part="link">Contacto</a>
          <span class="sep" data-part="sep">•</span>
          <div class="social" aria-label="Redes sociales">
            <a href="#" aria-label="Facebook" class="icon">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M22 12.06C22 6.48 17.52 2 11.94 2S2 6.48 2 12.06c0 5.01 3.66 9.17 8.44 9.94v-7.03H7.9v-2.9h2.54V9.41c0-2.5 1.49-3.88 3.77-3.88 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.87h2.78l-.44 2.9h-2.34V22c4.78-.77 8.44-4.93 8.44-9.94Z"/></svg>
            </a>
            <a href="#" aria-label="X/Twitter" class="icon">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M3 3h4.6l4.1 6.1L16.8 3H21l-7.3 9.4L21 21h-4.6l-4.5-6.7L7.2 21H3l7.7-9.9L3 3Z"/></svg>
            </a>
            <a href="#" aria-label="Instagram" class="icon">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 0 5-5Zm10 2H7a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3Zm-5 3.8a5.2 5.2 0 1 1 0 10.4A5.2 5.2 0 0 1 12 7.8Zm0 2a3.2 3.2 0 1 0 0 6.4 3.2 3.2 0 0 0 0-6.4Zm4.8-.6a.9.9 0 1 1 0 1.8.9.9 0 0 1 0-1.8Z"/></svg>
            </a>
          </div>
          <span class="sep" data-part="sep">•</span>
          <a href="legalpolitics.html" class="footer-link" data-part="link">Políticas legales</a>
        </nav>
        <div class="copy" data-part="copy">
          <small>© 2025 — <strong>Memories+</strong></small>
        </div>
      </div>
    </footer>
  </div>

  <script type="module">
    import { requireAuth, currentUser, logoutAndGo } from "./assets/js/services/auth_service.js";
    import { pb } from "./assets/js/pb.js";
    import {
      listPhotos,
      uploadPhoto,
      deletePhoto, toggleFavorite, fileUrl
    } from "./assets/js/services/photos_services.js";

    // Auth + logout
    requireAuth("login.html");
    const logoutLink = [...document.querySelectorAll('[data-part="menu-item"]')].find(a => a.textContent.includes("Cerrar sesión"));
    logoutLink?.addEventListener("click", e => { e.preventDefault(); logoutAndGo("login.html"); });

    // Avatar
    const user = currentUser();
    const headerImg = document.querySelector('[data-part="avatar"]');
    const headerSummary = document.querySelector('[data-part="summary"]');
    if (user?.avatar) {
      headerImg.src = pb.files.getUrl(user, user.avatar, { token: pb.authStore.token, thumb: "100x100" });
      headerImg.alt = user?.username || "Tu avatar";
      headerImg.style.display = "block";
    } else {
      headerImg.style.display = "none";
      const div = document.createElement("div");
      div.className = "avatar-initials";
      div.textContent = (user?.name || user?.username || "?").split(/\s+/).map(w => w[0]).slice(0,2).join("").toUpperCase();
      headerSummary.appendChild(div);
    }

    // Refs UI
    const grid = document.querySelector('[data-component="PhotoGrid"]');
    const qInput = document.querySelector('#q');
    const sortBtn = document.querySelector('[data-part="sort"]');
    const uploadBtn = document.querySelector('[data-part="upload"]');
    const fileInput = document.querySelector('#photo-file');
    const selectBtn = document.querySelector('[data-part="select"]');
    const deleteBtn = document.querySelector('[data-part="delete"]');
    const msg = document.querySelector('#photos-msg');
    const filterChips = document.querySelectorAll('.chip');

    // Estado
    const state = { page: 1, perPage: 24, sort: "-created", q: "", selecting: false, selected: new Set(), filter: "" };

    // Renderizado de tarjetas
    function card(rec) {
      const src = rec.field ? fileUrl(rec, rec.field, "600x0") : "";
      const fav = rec.favourite ? "★" : "☆";
      const checked = state.selected.has(rec.id) ? "checked" : "";
      return `
        <article class="photo-card card" data-id="${rec.id}">
          <div class="cover">
            <img src="${src}" alt="${rec.title || 'Foto'}" loading="lazy">
            ${state.selecting ? `<input class="sel" type="checkbox" ${checked}/>` : ""}
            <button class="fav" title="Favorito">${fav}</button>
          </div>
          ${rec.title ? `<div class="pad"><div class="p">${rec.title}</div></div>` : ""}
        </article>`;
    }

    function bindCardEvents() {
      grid.querySelectorAll('.photo-card').forEach(el => {
        const id = el.dataset.id;
        el.querySelector('.sel')?.addEventListener('change', e => {
          if (e.target.checked) state.selected.add(id); else state.selected.delete(id);
          updateBulkButtons();
        });
        el.querySelector('.fav')?.addEventListener('click', async (e) => {
          const btn = e.currentTarget;
          btn.disabled = true;
          try {
            const isFav = btn.textContent === "★";
            const rec = await toggleFavorite(id, isFav);
            btn.textContent = rec.favourite ? "★" : "☆";
          } catch (err) { console.error(err); }
          finally { btn.disabled = false; }
        });
      });
    }

    function updateBulkButtons() { deleteBtn.disabled = state.selected.size === 0; }
    
    // Carga de fotos
    async function load() {
      if (!grid) return;
      grid.innerHTML = `<p class="p">Cargando…</p>`;
      msg.textContent = "";

      try {
        const searchFilter = state.q ? `(title ~ "${state.q}" || location ~ "${state.q}" || tags ~ "${state.q}")` : "";
        const finalFilter = [state.filter, searchFilter].filter(Boolean).join(" && ");

        const opts = { page: state.page, perPage: state.perPage, sort: state.sort, filter: finalFilter };
        const res = await listPhotos(opts);

        if (!res.items.length) {
          grid.innerHTML = `<p class="p">No se encontraron fotos con los filtros actuales.</p>`;
          return;
        }
        grid.innerHTML = res.items.map(card).join("");
        bindCardEvents();
        updateBulkButtons();
        sortBtn.textContent = state.sort.startsWith('-') ? '↕ Ordenar (recientes)' : '↕ Ordenar (antiguas)';
      } catch (err) {
        console.error(err);
        grid.innerHTML = `<p class="p" style="color:#ef4444;">Error al cargar las fotos.</p>`;
      }
    }

    // Eventos UI
    function debounce(fn, ms = 300) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
    qInput?.addEventListener('input', debounce(e => {
      state.q = e.target.value.trim();
      state.page = 1;
      load();
    }, 300));

    filterChips.forEach(chip => {
      chip.addEventListener('click', () => {
        if (chip.disabled) return;
        
        filterChips.forEach(c => c.classList.remove('active'));
        chip.classList.add('active');

        if (chip.classList.contains('favoritos')) {
          state.filter = 'favourite = true';
        } else if (chip.classList.contains('todos')) {
          state.filter = '';
        }
        // Otros filtros (videos, álbumes) deshabilitados por ahora

        state.page = 1;
        load();
      });
    });

    sortBtn?.addEventListener('click', () => {
      state.sort = state.sort.startsWith('-') ? 'created' : '-created';
      state.page = 1; load();
    });

    uploadBtn?.addEventListener('click', () => fileInput?.click());
    fileInput?.addEventListener('change', async () => {
      for (const f of [...(fileInput.files || [])]) {
        try { await uploadPhoto({ file: f }); }
        catch (err) { console.error("Falló subida", f.name, err); }
      }
      fileInput.value = "";
      load();
    });

    selectBtn?.addEventListener('click', () => {
      state.selecting = !state.selecting;
      state.selected.clear();
      selectBtn.classList.toggle('active', state.selecting);
      load();
    });

    deleteBtn?.addEventListener('click', async () => {
      if (!state.selected.size || !confirm(`¿Borrar ${state.selected.size} foto(s)?`)) return;
      for (const id of state.selected) {
        try { await deletePhoto(id); } catch (err) { console.error(err); }
      }
      state.selected.clear();
      load();
    });

    load();
</script>
</body>
</html>
