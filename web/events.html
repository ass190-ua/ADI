<!doctype html>
<html lang="es" data-theme="dark" data-component="EventsPage">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eventos · Memories+</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body data-part="body">
  <div class="page" data-component="MainLayout">

    <header class="app-header" data-component="AppHeader" data-variant="private">
      <div class="brand" data-part="brand">
        <a class="logo" href="home.html" data-part="logo-link">
          <img src="assets/img/logo_header.png" alt="Memories+" data-part="logo-img">
          <span class="visually-hidden">Memories+</span>
        </a>
      </div>
      <input type="checkbox" id="menu-toggle" class="menu-toggle" aria-label="Abrir menú" data-part="menu-toggle">
      <label for="menu-toggle" class="menu-btn" data-part="menu-btn">☰</label>
      <nav class="app-nav" aria-label="Secciones" data-part="nav"></nav>
      <div class="user-actions" data-part="user-actions">
        <details class="user-menu" data-component="UserMenu">
          <summary aria-label="Abrir menú de usuario" data-part="summary">
            <img class="avatar" src="" alt="Tu avatar" data-part="avatar" style="display:none;">
          </summary>
          <nav class="menu" aria-label="Menú de usuario" data-part="menu">
            <a href="profile.html" data-part="menu-item">👤 Perfil</a>
            <a href="login.html" data-part="menu-item">⏻ Cerrar sesión</a>
          </nav>
        </details>
      </div>
    </header>

    <main class="app-shell" data-component="AppShell">
      <aside class="sidebar" data-component="Sidebar">
        <nav class="sidebar-nav" aria-label="Principal" data-component="SiteNav">
          <a href="home.html" data-part="nav-link">🏠 Inicio</a>
          <a href="photos.html" data-part="nav-link">🖼️ Fotos</a>
          <a href="chats.html" data-part="nav-link">💬 Chats</a>
          <a href="events.html" aria-current="page" data-part="nav-link">🎉 Eventos</a>
        </nav>
      </aside>

      <section class="app-main container" data-component="EventsContent">
        <div class="row" style="justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;" data-component="SectionHeader">
          <h1 class="h2" style="margin:0;" data-part="title">Eventos</h1>
          <div class="row" style="gap:8px; flex-wrap:wrap;" data-part="chips">
            <button class="chip todos" type="button" data-part="chip">Hoy</button>
            <button class="chip favoritos" type="button" data-part="chip">Esta semana</button>
            <button class="chip videos active" type="button" data-part="chip">Próximos</button>
            <button class="chip albumnes" type="button" data-part="chip">Pasados</button>
            <a class="btn" href="event-create.html" data-part="create">➕ Crear evento</a>
          </div>
        </div>

        <div class="row" style="gap:10px; margin-top:10px; flex-wrap:wrap;" data-component="Toolbar">
          <div class="input" style="flex:1; min-width:220px;" data-part="search">
            <label class="visually-hidden" for="q">Buscar eventos</label>
            <input id="q" type="search" placeholder="Buscar por nombre, lugar o fecha… 🔍">
          </div>
          <button class="btn ghost" type="button" style="color: white;" data-part="sort">↕ Ordenar</button>
          <button class="btn ghost" type="button" style="color: white;" data-part="select">✅ Seleccionar</button>
          <button class="btn ghost" type="button" style="color: white;" data-part="manage">⚙️ Gestionar eventos</button>
          <button class="btn ghost" type="button" style="color: white;" data-part="invites" disabled>🎟️ Mis invitaciones</button>
          <button class="btn ghost" type="button" style="color: white;" data-part="delete" disabled>🗑️ Eliminar</button>
        </div>

        <section class="events-grid" data-component="EventsGrid" aria-label="Listado de eventos"></section>
      </section>
    </main>

    <footer class="footer book-footer" data-component="AppFooter"></footer>
  </div>

  <script type="module">
    import { requireAuth, logoutAndGo, currentUser } from "./assets/js/services/auth_service.js";
    import { pb } from "./assets/js/pb.js";
    import { listEvents, deleteEvent, fileUrl } from "./assets/js/services/events_services.js";

    function mountAvatarOrInitials({ container, imgEl, nameOrUser, fileUrl }) {
      if (!container) return;
      container.querySelector('.avatar-initials')?.remove();
      if (fileUrl) {
        if (imgEl) { imgEl.src = fileUrl; imgEl.alt = nameOrUser || "avatar"; imgEl.style.display = "block"; }
      } else {
        if (imgEl) imgEl.style.display = "none";
        const initials = (nameOrUser||"?").toString().trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
        const div = document.createElement('div');
        div.className = 'avatar-initials';
        div.textContent = initials;
        container.appendChild(div);
      }
    }

    requireAuth("login.html");
    const me = currentUser();
    const headerWrap = document.querySelector('[data-component="UserMenu"] [data-part="summary"]');
    const headerImg  = document.querySelector('[data-component="UserMenu"] [data-part="avatar"]');
    const meUrl = me?.avatar ? pb.files.getUrl(me, me.avatar, { token: pb.authStore.token, thumb: "100x100" }) : null;
    mountAvatarOrInitials({ container: headerWrap, imgEl: headerImg, nameOrUser: me?.name || me?.username, fileUrl: meUrl });
    const logoutLink = [...document.querySelectorAll('[data-part="menu-item"]')].find(a => a.textContent.includes("Cerrar sesión"));
    if (logoutLink) { logoutLink.addEventListener("click", (e) => { e.preventDefault(); logoutAndGo("login.html"); }); }

    // 1) Elementos de la UI
    const grid = document.querySelector(".events-grid");
    const searchInput = document.querySelector("#q");
    const chipHoy = document.querySelector('.chip.todos');
    const chipSemana = document.querySelector('.chip.favoritos');
    const chipProx = document.querySelector('.chip.videos');
    const chipPasados = document.querySelector('.chip.albumnes');
    const sortBtn = document.querySelector('[data-part="sort"]');
    const manageBtn = document.querySelector('[data-part="manage"]');
    const selectBtn = document.querySelector('[data-part="select"]');
    const deleteBtn = document.querySelector('[data-part="delete"]');

    let pager = document.querySelector('#events-pager');
    if (!pager) {
      pager = document.createElement('div');
      pager.id = 'events-pager';
      pager.className = 'row';
      pager.style.cssText = 'gap:8px; justify-content:center; margin:12px 0;';
      grid.after(pager);
    }

    // 2) Estado (ampliado)
    const url = new URL(location.href);
    const getParam = (k, def='') => url.searchParams.get(k) ?? def;

    const state = {
      page: Number(getParam('page', '1')) || 1,
      perPage: 8,
      q: getParam('q', ''),
      when: getParam('when', 'upcoming'),
      sort: getParam('sort', '-date,-created'),
      totalPages: 1,
      managing: getParam('managing') === 'true',
      selecting: false,
      selected: new Set()
    };

    if (searchInput) searchInput.value = state.q || '';
    if (manageBtn) manageBtn.classList.toggle('active', state.managing);
    
    function setActiveChipFromState() {
      [chipHoy, chipSemana, chipProx, chipPasados].forEach(el => el?.classList.remove('active'));
      const map = { today: chipHoy, week: chipSemana, upcoming: chipProx, past: chipPasados };
      (map[state.when] ?? chipProx)?.classList.add('active'); // Próximos por defecto si no hay nada
    }
    setActiveChipFromState();
    
    if (sortBtn) sortBtn.textContent = state.sort.startsWith('-date') ? '↕ Ordenar (próximos)' : '↕ Ordenar (antiguos)';
    
    function syncUrl() {
      const u = new URL(location.href);
      const set = (k, v) => { v ? u.searchParams.set(k, String(v)) : u.searchParams.delete(k); };
      set('page', state.page > 1 ? state.page : '');
      set('q', state.q);
      set('when', state.when);
      set('sort', state.sort);
      set('managing', state.managing);
      history.replaceState(null, '', u.toString());
    }

    // 3) Filtros (modificado)
    const toISO = (d) => new Date(d).toISOString();
    function dayBoundsLocal(d = new Date()) {
        const start = new Date(d); start.setHours(0,0,0,0);
        const end = new Date(d); end.setHours(23,59,59,999);
        return { startISO: toISO(start), endISO: toISO(end) };
    }
    function buildWhenFilter() {
      const now = new Date();
      const nowISO = toISO(now);
      switch (state.when) {
        case 'today':
            const { startISO, endISO } = dayBoundsLocal(now);
            return `(date >= "${startISO}" && date <= "${endISO}")`;
        case 'week':
            const weekTo = new Date(now); weekTo.setDate(weekTo.getDate() + 7);
            return `(date >= "${nowISO}" && date < "${toISO(weekTo)}")`;
        case 'upcoming': return `(date >= "${nowISO}")`;
        case 'past': return `(date < "${nowISO}")`;
        default: return "";
      }
    }
    function buildSearchFilter() {
      if (!state.q) return "";
      const q = state.q.replace(/"/g, '\\"');
      return `(title ~ "${q}" || description ~ "${q}" || location ~ "${q}")`;
    }
    function composeFilter() {
      const managingFilter = state.managing ? `user = "${me.id}"` : "";
      const parts = [buildWhenFilter(), buildSearchFilter(), managingFilter].filter(Boolean);
      return parts.join(" && ");
    }

    // 4) Render (modificado)
    const fmtDate = (isoStr) => isoStr ? new Date(isoStr).toLocaleString("es-ES", { dateStyle: "medium", timeStyle: "short" }) : "Sin fecha";
    const FALLBACK_SVG = `data:image/svg+xml;utf8,...`; // sin cambios
    
    function renderCard(rec) {
      const cover = rec.cover ? fileUrl(rec, rec.cover, '300x200') : FALLBACK_SVG;
      const title = rec.title || "Evento";
      const date = fmtDate(rec.date);
      const location = rec.location || "";
      const checked = state.selected.has(rec.id) ? "checked" : "";
      const selectionInput = state.selecting ? `<input class="sel" type="checkbox" ${checked} style="position:absolute; left:8px; top:8px; width:18px; height:18px; z-index: 5;"/>` : "";

      return `
        <article class="card event-card" data-component="EventCard" data-id="${rec.id}" style="position:relative;">
          ${selectionInput}
          <a href="event.html?id=${rec.id}" class="event-cover" aria-label="Ver evento: ${title}" data-part="cover">
            <img src="${cover}" alt="${title}" loading="lazy" data-part="image">
          </a>
          <div class="pad" data-part="body">
            <div class="row" style="justify-content:space-between; align-items:center;" data-part="header">
              <h2 class="h4" style="margin:0;" data-part="name">
                <a class="link" href="event.html?id=${rec.id}">${title}</a>
              </h2>
              <span class="badge soft" data-part="date">${date}</span>
            </div>
            <p class="p" style="opacity:.9; margin:6px 0 8px;" data-part="subtitle">${location}</p>
          </div>
        </article>`;
    }

    function renderPager() {
      pager.innerHTML = `
        <button class="btn ghost" style="color: white;" ${state.page <= 1 ? "disabled" : ""} data-act="prev">‹ Anteriores</button>
        <span class="p">Página ${state.page} / ${state.totalPages || 1}</span>
        <button class="btn ghost" style="color: white;" ${state.page >= (state.totalPages || 1) ? "disabled" : ""} data-act="next">Siguientes ›</button>
      `;
    }
    pager.addEventListener('click', (e) => {
        const act = e.target?.closest('[data-act]')?.dataset.act;
        if (act === 'prev' && state.page > 1) { state.page--; syncUrl(); load(); }
        if (act === 'next' && state.page < state.totalPages) { state.page++; syncUrl(); load(); }
    });

    // 5) Carga de datos (modificado)
    async function load() {
      grid.innerHTML = `<p class="p">Cargando eventos…</p>`;
      try {
        const res = await listEvents({ page: state.page, perPage: state.perPage, sort: state.sort, filter: composeFilter() });
        state.totalPages = res.totalPages || 1;
        if (!res.items.length) {
          grid.innerHTML = `<p class="p">No hay eventos que coincidan.</p>`;
        } else {
          grid.innerHTML = res.items.map(renderCard).join("");
          bindCardEvents();
          updateBulkButtons();
        }
        renderPager();
      } catch (e) {
        console.error(e);
        grid.innerHTML = `<p class="p" style="color:#e00">Error al cargar eventos.</p>`;
        state.totalPages = 1;
        renderPager();
      }
    }

    // 6) Event listeners
    function bindCardEvents() {
        grid.querySelectorAll('.event-card .sel').forEach(el => {
            const id = el.closest('.event-card').dataset.id;
            el.addEventListener('change', () => {
                if (el.checked) state.selected.add(id);
                else state.selected.delete(id);
                updateBulkButtons();
            });
        });
    }

    function updateBulkButtons() {
        deleteBtn.disabled = state.selected.size === 0;
    }

    function debounce(fn, ms=300) { let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); }; }

    searchInput?.addEventListener('input', debounce((e) => {
        state.q = e.target.value.trim();
        state.page = 1;
        syncUrl();
        load();
    }, 300));

    function setActiveChip(activeEl) {
      [chipHoy, chipSemana, chipProx, chipPasados].forEach(el => el?.classList.remove('active'));
      activeEl?.classList.add('active');
    }
    chipHoy?.addEventListener('click', () => { state.when = 'today'; state.page = 1; setActiveChip(chipHoy); syncUrl(); load(); });
    chipSemana?.addEventListener('click', () => { state.when = 'week'; state.page = 1; setActiveChip(chipSemana); syncUrl(); load(); });
    chipProx?.addEventListener('click', () => { state.when = 'upcoming'; state.page = 1; setActiveChip(chipProx); syncUrl(); load(); });
    chipPasados?.addEventListener('click', () => { state.when = 'past'; state.page = 1; setActiveChip(chipPasados); syncUrl(); load(); });

    sortBtn?.addEventListener('click', () => {
      state.sort = state.sort.startsWith('-date') ? 'date,created' : '-date,-created';
      sortBtn.textContent = state.sort.startsWith('-date') ? '↕ Ordenar (próximos)' : '↕ Ordenar (antiguos)';
      state.page = 1;
      syncUrl();
      load();
    });

    manageBtn?.addEventListener('click', () => {
        state.managing = !state.managing;
        manageBtn.classList.toggle('active', state.managing);
        state.page = 1;
        syncUrl();
        load();
    });

    selectBtn?.addEventListener('click', () => {
        state.selecting = !state.selecting;
        state.selected.clear();
        selectBtn.classList.toggle('active', state.selecting);
        if (!state.selecting) {
            deleteBtn.disabled = true;
        }
        load();
    });

    deleteBtn?.addEventListener('click', async () => {
        if (state.selected.size === 0 || !confirm(`¿Seguro que quieres eliminar ${state.selected.size} evento(s)?`)) return;
        
        deleteBtn.disabled = true;
        deleteBtn.textContent = 'Eliminando...';

        for (const id of state.selected) {
            try { await deleteEvent(id); }
            catch (err) { console.error(`Error al borrar el evento ${id}:`, err); }
        }
        
        state.selected.clear();
        state.selecting = false;
        selectBtn.classList.remove('active');
        deleteBtn.textContent = '🗑️ Eliminar';
        
        load();
    });

    // 7) GO!
    syncUrl();
    load();
  </script>
</body>
</html>
