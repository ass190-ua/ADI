<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat · Memories+</title>
  <link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <div class="app chat-page">
    <header class="header"><div class="logo">Memories+</div><div class="row"><a class="btn" href="chats.html">← Volver</a></div></header>
    <aside class="sidebar"><nav class="nav"><a href="chats.html" aria-current="page">💬 Chats</a><a href="events.html">🎉 Eventos</a></nav></aside>
    <main class="main">
      <h1 class="h2" style="margin:0 0 10px;">Ana <span class="badge">en línea</span></h1>
      <section class="chat">
        <div class="msg them">¡Mañana es el cumple!<span class="time">18:10</span></div>
        <div class="msg me">¡Sí! Llevo la cámara 📷<span class="time">18:12</span></div>
        <div class="msg them">Genial. ¿Subes luego las fotos?<span class="time">18:13</span></div>
      </section>
      <div class="composer card pad">
        <div class="input"><label class="p">Mensaje (maqueta)</label><input placeholder="Escribe tu mensaje…" disabled></div>
        <div class="row" style="gap:8px; justify-content:flex-end;">
          <button class="btn" disabled>Adjuntar</button>
          <button class="btn primary" disabled>Enviar</button>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
