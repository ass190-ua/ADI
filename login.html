<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Memories+</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <div class="page">
    <!-- Header público -->
    <header class="header landing-header">
      <div class="logo">
        <a href="index.html"><img src="assets/img/logo_header.png" alt="Memories+"></a>
      </div>
      <nav class="row cta-header" aria-label="Acciones">
        <a class="btn ghost login-btn" href="login.html">Iniciar sesión</a>
        <a class="btn primary signup-btn" href="register.html" aria-label="Crear cuenta gratis en Memories+">Crear cuenta</a>
      </nav>
    </header>

    <!-- Main centrado -->
    <main class="container auth-page">
      <section class="card pad" style="width:min(520px, 92%);">
        <h1 class="h2" style="margin:0 0 8px;">Bienvenido de nuevo</h1>
        <p class="p" style="margin:0 0 14px;">Accede para ver tus recuerdos</p>

        <form class="form" aria-label="Formulario de acceso">
          <div class="input">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="tú@correo.com" required>
          </div>

          <div class="input">
            <label for="pass">Contraseña</label>
            <input id="pass" type="password" placeholder="••••••••" required>
          </div>

          <div class="actions">
            <a class="btn primary" href="home.html">Entrar</a>
            <a class="btn" href="register.html">Crear cuenta</a>
          </div>
        </form>
      </section>
    </main>

    <!-- Footer estilo BookCase -->
    <footer class="footer book-footer">
      <div class="container">
        <nav class="navline" aria-label="Enlaces del pie">
          <a href="#" class="footer-link">Contacto</a>
          <span class="sep">•</span>
          <div class="social" aria-label="Redes sociales">
            <a href="#" aria-label="Facebook" class="icon">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M22 12.06C22 6.48 17.52 2 11.94 2S2 6.48 2 12.06c0 5.01 3.66 9.17 8.44 9.94v-7.03H7.9v-2.9h2.54V9.41c0-2.5 1.49-3.88 3.77-3.88 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.87h2.78l-.44 2.9h-2.34V22c4.78-.77 8.44-4.93 8.44-9.94Z"/></svg>
            </a>
            <a href="#" aria-label="X/Twitter" class="icon">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M3 3h4.6l4.1 6.1L16.8 3H21l-7.3 9.4L21 21h-4.6l-4.5-6.7L7.2 21H3l7.7-9.9L3 3Z"/></svg>
            </a>
            <a href="#" aria-label="Instagram" class="icon">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 0 5-5Zm10 2H7a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3Zm-5 3.8a5.2 5.2 0 1 1 0 10.4A5.2 5.2 0 0 1 12 7.8Zm0 2a3.2 3.2 0 1 0 0 6.4 3.2 3.2 0 0 0 0-6.4Zm4.8-.6a.9.9 0 1 1 0 1.8.9.9 0 0 1 0-1.8Z"/></svg>
            </a>
          </div>
          <span class="sep">•</span>
          <a href="#" class="footer-link">Políticas legales</a>
        </nav>

        <div class="copy">
          <small>© 2025 — <strong>Memories+</strong></small>
        </div>
      </div>
    </footer>
  </div>
</body>
</html>
